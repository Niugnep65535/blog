name: Hugo Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: hugomods/hugo:latest
      privileged: true
      volumes:
        - /mnt/data/blog/public:/deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Hugo site
        run: hugo --gc --minify
        
      - name: Copying Markdown version
        run: |
          cp -r content/ public

      - name: Deploy
        run: |
          rm -rf /deploy/*
          cp -a public/. /deploy/