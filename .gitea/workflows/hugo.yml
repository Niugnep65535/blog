name: Hugo Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: hugomods/hugo:168
      privileged: true
      volumes:
        - /mnt/data/blog/public:/deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Hugo site
        run: hugo --gc --minify

      - name: Deploy
        run: |
          rm -rf /deploy/*
          cp -a public/. /deploy/

      - name: Verify deployment
        run: |
          test -f /deploy/index.html
          echo "Hugo deploy successful."
          echo "Deployed files:"
          find /deploy -maxdepth 2 -type f | sort | head -50
