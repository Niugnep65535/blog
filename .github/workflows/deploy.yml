name: Deploy Hugo Site to GitHub Pages

on:
  push:
    branches:
      - main

# GitHub Pages 部署需要的權限（為了讓 rebuild 能寫入檔案，需將 contents 改為 write）
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      # --- 插入的控制邏輯（位於 Build 之前）---
      - name: Read control file
        id: read_file
        run: |
          FILE_PATH="dontbuild-flag"
          if [ -f "$FILE_PATH" ]; then
            echo "偵測到 dontbuild-flag，停止後續的建置與部署流程。"
            exit 1
          fi
      # ----------------------------------------

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Copy Markdown source files
        run: |
          mkdir -p static/markdown
          cp -r content/posts/* static/markdown/

      - name: Build
        run: hugo --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
