# Hugo configuration file
baseurl: "/"
locale: "zh-Hant"
title: "Niugnep 的部落格"
theme: "hextra"

# import hextra as module
#module:
#  imports:
#    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: "所有文章"
      pageRef: /archives
      weight: 1

    - name: "標籤"
      pageRef: /tags
      weight: 2

    - name: "部落捲"
      pageRef: /blogroll
      weight: 3

    - name: "關於"
      pageRef: /about
      weight: 4

    - name: "愛用"
      pageRef: /use
      weight: 5

    - name: "近況"
      pageRef: /now
      weight: 6

    - name: GitHub
      weight: 7
      url: "https://github.com/Niugnep65535"
      params:
        icon: github

    - name: Mail
      weight: 8
      url: "mailto:penguin@niugnep.idv.tw"
      params:
        icon: mail

params:
  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: false
    displayPoweredBy: true

  editURL:
    enable: false
    base: "https://github.com/imfing/hextra-starter-template/edit/main/content"
