# Hugo configuration file
baseurl: "/"
locale: "zh-Hant"
defaultContentLanguage: "zh-tw"
title: "Niugnep 的部落格"
theme: "hextra"

# import hextra as module
#module:
#  imports:
#    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: "所有文章"
      pageRef: /blog
      weight: 1

  #  - name: "分類"
  #    pageRef: /categories
  #    weight: 2

  #  - name: "標籤"
  #    pageRef: /tags
  #    weight: 3

    - name: "部落捲"
      pageRef: /blogroll
      weight: 4

    - name: "關於"
      pageRef: /about
      weight: 5

    - name: "愛用"
      pageRef: /use
      weight: 6

    - name: "近況"
      pageRef: /now
      weight: 7
      
    - name: "紀錄點"
      pageRef: /checkpoint
      weight: 8
      
    - name: "原始碼"
      pageRef: https://niugnep.idv.tw/redir-gitea
      weight: 9

    - name: GitHub
      url: "https://github.com/Niugnep65535"
      params:
        icon: github

    - name: Mail
      url: "mailto:penguin@niugnep.idv.tw"
      params:
        icon: mail

    - name: Search
      params:
        type: search
  

params:
  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: true
    displayPoweredBy: false

  editURL:
    enable: true
    base: "https://github.com/Niugnep65535/blog/blob/main/content"

  # Search
  search:
    enable: true
    type: flexsearch
    flexsearch:
      # index page by: content | summary | heading | title
      index: content
      
  favicon:
    png: /img/favicon.png
    
  comments:
    enable: true
    type: giscus

    giscus:
      repo: Niugnep65535/blog-comments
      repoId: R_kgDORI815g
      category: Announcements
      categoryId: DIC_kwDORI815s4C82_p
      mapping: pathname

hasCJKLanguage: true
imaging:
  resampleFilter: lanczos
  quality: 75
  anchor: smart
