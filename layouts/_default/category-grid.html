<style>
.custom-categories-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 16px;
  margin-top: 20px;
}

.category-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  /* 使用 PaperMod 原生的卡片背景與邊框變數，自動適應明暗模式 */
  background-color: var(--entry);
  border: 1px solid var(--border);
  border-radius: 12px;
  text-decoration: none !important;
  color: var(--primary) !important;
  transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
}

.category-card:hover {
  transform: translateY(-3px);
  background-color: var(--theme);
  border-color: var(--secondary);
}

.category-icon {
  font-size: 32px;
  margin-bottom: 12px;
  color: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  height: 32px;
}

/* 讓內聯的 GNU SVG 圖示顏色跟隨 PaperMod 的文字顏色變數 (`var(--primary)`)，亮色模式為黑/深灰，暗黑模式自動變成白色 */
.gnu-inline-logo {
  width: 32px;
  height: 32px;
  fill: var(--primary);
}

.category-name {
  font-size: 14px;
  font-weight: 500;
  text-align: center;
  line-height: 1.4;
  color: var(--primary);
}
</style>
{{- end -}}
