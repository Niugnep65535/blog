{{- define "main" -}}
<main class="main">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
  </header>
  
  <div class="post-content">
    {{ .Content }}
    
    <!-- 分類圖示網格 -->
    <div class="custom-categories-grid">
      
      <!-- 1. GNU/Linux 或 Linux (Tux 意象) -->
      <a href="/categories/gnu-linux-%E6%88%96-linux/" class="category-card">
        <div class="category-icon">
          <svg viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 0 1 7.54 16.63A7 7 0 0 0 12 15a7 7 0 0 0-7.54 3.63A10 10 0 0 1 12 2z"></path></svg>
        </div>
        <div class="category-name">GNU/Linux 或 Linux</div>
      </a>

      <!-- 2. 不日常的日常 (星星) -->
      <a href="/categories/%E4%B8%8d%E6%97%A5%E5%B8%B8%E7%9A%84%E6%97%A5%E5%B8%B8/" class="category-card">
        <div class="category-icon">
          <svg viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
        </div>
        <div class="category-name">不日常的日常</div>
      </a>

      <!-- 3. 技能競賽、技藝班與升學 (書本) -->
      <a href="/categories/%E6%8A%80%E8%83%BD%E7%AB%B6%E8%B3%BD%E3%80%81%E6%8A%80%E8%97%9D%E7%8F%AD%E8%88%87%E5%8D%87%E5%AD%B8/" class="category-card">
        <div class="category-icon">
          <svg viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        </div>
        <div class="category-name">技能競賽、技藝班與升學</div>
      </a>

      <!-- 4. 日常與壓力垃圾桶 (垃圾桶) -->
      <a href="/categories/%E6%97%A5%E5%B8%B8%E8%88%87%E5%A3%93%E5%8A%9B%E5%9E%83%E5%9C%BE%E6%A1%B6/" class="category-card">
        <div class="category-icon">
          <svg viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        </div>
        <div class="category-name">日常與壓力垃圾桶</div>
      </a>

      <!-- 5. 網際網路與 Web (地球) -->
      <a href="/categories/%E7%B6%B2%E9%99%9B%E7%B6%B2%E8%B7%AF%E8%88%87-web/" class="category-card">
        <div class="category-icon">
          <svg viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
        </div>
        <div class="category-name">網際網路與 Web</div>
      </a>

      <!-- 6. 自由軟體與開源哲學 (使用官方 GNU SVG) -->
      <a href="/categories/%E8%87%AA%E7%94%B1%E8%BB%9F%E9%AB%94%E8%88%87%E9%96%8b%E6%BA%90%E5%93%B2%E5%AD%B8/" class="category-card">
        <div class="category-icon">
          <img src="https://upload.wikimedia.org/wikipedia/commons/d/df/GNU.svg" alt="GNU Logo" class="gnu-logo" width="32" height="32">
        </div>
        <div class="category-name">自由軟體與開源哲學</div>
      </a>

    </div>
  </div>
</main>

<style>
.custom-categories-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 16px;
  margin-top: 20px;
}

.category-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  background-color: #2a2a2a;
  border: 1px solid #3a3a3a;
  border-radius: 12px;
  text-decoration: none !important;
  color: #ffffff !important;
  transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
}

.category-card:hover {
  transform: translateY(-3px);
  background-color: #333333;
  border-color: #555555;
}

.category-icon {
  font-size: 32px;
  margin-bottom: 12px;
  color: #e0e0e0;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 32px;
}

.category-icon svg {
  stroke: #e0e0e0;
}

/* 針對 Wikimedia GNU 官方圖示在暗黑模式下的顏色調整（若原圖為黑色，透過濾鏡轉為亮灰色/白色） */
.gnu-logo {
  filter: invert(0.9); /* 將黑色的 GNU 圖標反轉成亮色，適應 PaperMod 暗黑主題 */
  width: 32px;
  height: 32px;
}

.category-name {
  font-size: 14px;
  font-weight: 500;
  text-align: center;
  line-height: 1.4;
}
</style>
{{- end -}}
